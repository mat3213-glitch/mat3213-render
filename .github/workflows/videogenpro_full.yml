name: VideoGenPro FULL spectrum demo

# Демо «на все 100%» (по запросу yaromat): все 9 типов слоёв (текст/image/video/html/
# three-particles/shape/overlay/fx-control/hyperframes-gsap), 40 пресетов из всех
# категорий (включая рискованные B02: sketch/glitch/neon-glow/gradient-sweep),
# Match&Move морфинг по matchId, ручные кейфреймы, crop, аудио-дорожка (kick 100 BPM)
# и аудио-реактивные пресеты. Видео+арты — случайные файлы из библиотеки ЯД
# pexels_pool (46 mp4 / 62 jpg, скачаны ранее с Pexels).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-spectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install ffmpeg + rclone
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing ffmpeg rclone

      - name: Checkout videogenpro
        uses: actions/checkout@v4
        with:
          repository: AnubhavChaturvedi-GitHub/videogenpro
          path: vgp

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps + build runtime + chromium
        working-directory: vgp
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm build:runtime
          npx playwright install --with-deps chromium

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Random-picked assets из библиотеки ЯД pexels_pool
        run: |
          mkdir -p assets
          P="ydrive:Content factory/pexels_pool"
          rclone copyto "$P/mist-mountains/788213.jpg"   assets/art1.jpg
          rclone copyto "$P/mist-mountains/35545610.jpg" assets/art2.jpg
          rclone copyto "$P/ocean-waves-slow/36952051.jpg" assets/art3.jpg
          rclone copyto "$P/empty-road-fog/37436340.jpg" assets/art4.jpg
          rclone copyto "$P/rain-night-city/35170756.mp4" assets/vid_rain.mp4
          rclone copyto "$P/misty-forest/27100098.mp4"    assets/vid_mist.mp4
          rclone copyto "$P/foggy-forest/30149713.mp4"    assets/vid_forest.mp4
          rclone copyto "$P/fog-nature/19806007.mp4"      assets/vid_fog.mp4
          ls -la assets

      - name: Kick 100 BPM (для аудио-пресетов) + hyperframes-ассет
        run: |
          ffmpeg -y -v error -f lavfi \
            -i "aevalsrc=if(lt(mod(t\,0.6)\,0.18)\,sin(2*PI*60*t)*exp(-16*mod(t\,0.6))\,0):d=32:s=44100" \
            -c:a pcm_s16le assets/kick.wav
          cat > assets/hf.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8">
          <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
          <style>body{margin:0;background:#0d1117;display:flex;align-items:center;justify-content:center;height:100vh;font-family:Georgia,serif;color:#e8e4da}#box{font-size:80px;letter-spacing:8px}</style>
          </head><body><div id="box">HYPERFRAMES</div><script>
          const tl = gsap.timeline({paused:true});
          tl.fromTo('#box',{opacity:0,scale:.6,rotate:-8},{opacity:1,scale:1,rotate:0,duration:1,ease:'back.out(2)'})
            .to('#box',{y:-60,color:'#9fd6a9',duration:.8});
          window.__timelines = { root: tl };
          </script></body></html>
          EOF
          ls -la assets

      - name: Composition — полный спектр
        run: |
          cat > comp.json <<'EOF'
          {
            "fps": 30,
