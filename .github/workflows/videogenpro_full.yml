          EOF
          python3 -m json.tool comp.json > /dev/null && echo "comp.json valid"

      - name: Render (замер времени)
        working-directory: vgp
        run: |
          set -o pipefail
          /usr/bin/time -v npx tsx packages/cli/src/render.ts ../comp.json ../out.mp4 2>&1 | grep -E "Elapsed|Maximum resident|frames|✅|❌|Error|error" || true
          ls -la ../out.mp4

      - name: Verify mp4
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4)
          RES=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -of csv=p=0 out.mp4)
          AUD=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 out.mp4 | head -1)
          echo "duration=${DUR}s res=${RES} audio=${AUD:-нет}"
          awk -v d="$DUR" 'BEGIN { if (d < 29.5 || d > 33) { print "FAIL: duration"; exit 1 } }'
          case "$RES" in *1080,1920,h264*|*h264,1080,1920*) echo "PASS: 1080x1920 h264";; *) echo "WARN: unexpected $RES";; esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vgp_full_spectrum_1080x1920
          path: out.mp4
          retention-days: 7

      - name: Upload to YD (превью на гейт yaromat)
        run: |
          DEST="ydrive:Content factory/cloud_io/preview/$(date -u +%F)/videogenpro_full"
          rclone copyto out.mp4 "$DEST/vgp_full_spectrum.mp4"
          N=$(rclone lsf "$DEST" | wc -l)
          echo "YD files in $DEST: $N"
          test "$N" -ge 1
