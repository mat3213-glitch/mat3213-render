                    "presets": [ { "id": "in.fade-down", "start": 0.6, "duration": 0.8 } ] }
                ]
              },
              {
                "id": "s2-video-breathe",
                "duration": 2.4,
                "transitionIn": { "id": "transition.push-up", "duration": 0.55 },
                "background": "#101413",
                "layers": [
                  { "type": "video", "src": "assets/vid_rain.mp4", "fit": "cover", "muted": false,
                    "rect": { "x": 0, "y": 0, "w": 1080, "h": 1920 },
                    "presets": [ { "id": "image.breathe", "duration": 2.4 } ] },
