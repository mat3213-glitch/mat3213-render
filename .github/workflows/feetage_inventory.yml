name: Feetage Inventory

# Инвентаризация футаж-библиотеки (рецепт 2, блок А, п.5): для каждого видео из
# feetage_dir детерминированно считаются палитра и интенсивность смены кадров +
# vision-ансамбль (art_judge.ask_vision) даёт качественные теги (сюжет/вайб/куда ляжет).
# Результат: <feetage_dir>/inventory/inventory.json + per-video json + sheets/.

on:
  workflow_dispatch:
    inputs:
      feetage_dir:
        description: 'ЯД-путь до папки с футажами (напр. Content factory/cloud_io/2026-09-14/submarina_futag_fetch/34834461164/raw)'
        required: true
        default: 'Content factory/cloud_io/2026-09-14/submarina_futag_fetch/34834461164/raw'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing rclone ffmpeg

      - name: Install python deps
        run: pip install -q pillow

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Run inventory
        env:
          FEETAGE_DIR:        ${{ inputs.feetage_dir }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_WORKER:  ${{ secrets.CLOUDFLARE_WORKER }}
          WORKER_SECRET:      ${{ secrets.WORKER_SECRET }}
        run: python -u feetage_inventory.py --feetage-dir "$FEETAGE_DIR"

      - name: Write error status on failure
        if: failure()
        run: |
          echo "feetage_inventory failed" >&2