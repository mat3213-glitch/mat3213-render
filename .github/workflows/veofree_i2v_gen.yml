name: VeoFree i2v Generate (1 per run)

on:
  workflow_dispatch:
    inputs:
      img_remote:
        description: 'YaDisk path to RAW stock image (не уникализированный)'
        required: true
      prompt:
        description: 'Motion prompt'
        required: true
      dest_folder:
        description: 'ЯД destination folder'
        required: true
      out_name:
        description: 'Output mp4 name (clip_01.mp4)'
        required: true
      aspect:
        description: 'Crop aspect (9:16 / 16:9 / 1:1)'
        required: false
        default: '9:16'

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: '3.11'
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing rclone
      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"
      - name: Install Playwright
        run: |
          pip install -q requests playwright
          python -m playwright install --with-deps chromium
      - name: Generate i2v
        env:
          IMG_REMOTE:      ${{ inputs.img_remote }}
          PROMPT:          ${{ inputs.prompt }}
          DEST_FOLDER:     ${{ inputs.dest_folder }}
          OUT_NAME:        ${{ inputs.out_name }}
          ASPECT:          ${{ inputs.aspect }}
        run: python veofree_i2v_gen.py
