name: _probe-free-models (one-off, удалить после прогона)

# 15.11: free-цирка OpenRouter — курируемый набор (модели деплоятся/исчезают,
# квоты уезжают). Помощник, чтобы перестраховать дефолтную цепочку чата на факт:
# каталог /models (без auth) + 5-символьный ping пяти моделям из цепочки.
# Использование: gh workflow run .github/workflows/_probe-free-models.yml
# После прогона ФАЙЛ УДАЛЯТЬ — он одноразовый, не Regular job.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Free-text model catalog (no auth)
        run: |
          curl -fsS https://openrouter.ai/api/v1/models | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rows=[]
          for m in d.get('data', []):
              p=m.get('pricing') or {}
              if str(p.get('prompt'))=='0' and str(p.get('completion'))=='0':
                  rows.append([m.get('id'), m.get('context_length')])
          print('FREE-TEXT:', len(rows))
          for r in rows[:200]:
              print('  ', ' '.join(map(str, r)))
          "

      - name: Probe chain candidates (200=ok 402=credit/tier 404=delisted)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for M in nvidia/nemotron-3-super-120b-a12b:free minimax/minimax-m3:free \
                   cohere/north-mini-code:free google/gemma-4-31b-it:free \
                   openrouter/free; do
            st=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 \
                 -H "Authorization: Bearer $OPENROUTER_API_KEY" -H "Content-Type: application/json" \
                 -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":5}" \
                 https://openrouter.ai/api/v1/chat/completions 2>/dev/null)
            [ -z "$st" ] && st="curl-error"
            echo "$st $M"
          done
