name: glm-gh fanout worker

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "id батча (имя in/out файла на ЯД)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: glm-shared-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.54.0"
          google-chrome --version
          sudo apt-get install -y rclone
          rclone version
          xvfb-run --help >/dev/null

      - name: Configure rclone
        env:
          YDRIVE_CLIENT_ID: ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN: ${{ secrets.YDRIVE_TOKEN }}
        run: |
          umask 077
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Pull GLM session
        run: |
          umask 077
          rclone copyto "ydrive:Content factory/cloud_io/cnchat_ci/glm_session.json" \
            Instrument/GLM/glm_session.json
          test "$(stat -c%s Instrument/GLM/glm_session.json)" -gt 1000

      - name: Run serialized batch
        env:
          INPUT_BATCH_ID: ${{ inputs.batch_id }}
        run: python3 glm_runner.py "$INPUT_BATCH_ID"

      - name: Persist refreshed session
        if: always()
        run: |
          if test -s Instrument/GLM/glm_session.json; then
            rclone copyto Instrument/GLM/glm_session.json \
              "ydrive:Content factory/cloud_io/cnchat_ci/glm_session.json"
          fi

      - name: Remove credentials
        if: always()
        run: rm -f Instrument/GLM/glm_session.json glm-session-refreshed.json "$HOME/.config/rclone/rclone.conf"
