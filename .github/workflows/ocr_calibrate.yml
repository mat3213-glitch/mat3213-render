name: OCR Calibrate (пороги гейта надписей на листе A)

# Гейт «нет текста в кадре» — хвост, который голосование VLM не закрывает: на листе A
# 29.07 надпись в `child.png` прошла ансамбль как чистый кадр.
# Здесь НЕ внедрение, а ЗАМЕР: перебор порогов на РАЗМЕЧЕННОМ листе (11 артов, из них
# один позитив — `reject/text_in_frame__child.png`) с печатью ДВУХ чисел: пойманное и ложное.
# Порог, пойманный «на глаз» по одному кадру, уже подводил (схемы голосования 30.07).
#
# tesseract ставится apt'ом на раннере: на буке (Atom, 1.8 ГБ) ни apt без sudo, ни лишняя
# нагрузка не нужны, а боевой гейт всё равно будет жить здесь же, внутри art_judge.

on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "Папка листа на ЯД (относительно Content factory/cloud_io/)"
        required: false
        default: "preview/2026-07-29/art_gate"
        type: string
      positive:
        description: "Подстрока в имени файла = кадр С НАДПИСЬЮ (позитив)"
        required: false
        default: "text_in_frame"
        type: string

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # was v7.0.0
        with:
          python-version: "3.11"

      - name: Install tesseract + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus rclone
          tesseract --version | head -2
          # rapidocr-onnxruntime (Apache-2.0) везёт модели детектора в самом пакете —
          # ни apt, ни выкачивания весов на раннере не требуется.
          pip install --quiet pytesseract pillow rapidocr-onnxruntime

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Pull labeled sheet
        env:
          SHEET: ${{ inputs.sheet }}
        run: |
          mkdir -p sheet
          # CONTACT_SHEET.jpg — сам по себе подписанная простыня из кадров; в выборке он
          # даёт гарантированный ложный позитив и портит замер.
          # 🔴 Порядок фильтров важен: rclone берёт ПЕРВОЕ совпавшее правило, поэтому
          # --exclude обязан стоять ДО --include (в прогоне 30807960774 он стоял после и
          # был проигнорирован — лист приехал и попал в выборку как 12-й файл).
          rclone copy "ydrive:Content factory/cloud_io/$SHEET" sheet \
            --exclude "CONTACT_SHEET*" --include "*.png" --include "*.jpg" -v
          # 🔴 Фильтр rclone лист НЕ отсёк ни до, ни после перестановки правил (проверено
          # в 30807960774 и 30808998513 — «CONTACT_SHEET.jpg: Copied»). Спорить с фильтром
          # дороже, чем удалить файл: выборка обязана быть чистой, иначе замер врёт.
          rm -f sheet/CONTACT_SHEET*
          find sheet -type f | sort

      - name: tesseract — по файлам и сеткой
        env:
          POSITIVE: ${{ inputs.positive }}
        run: |
          python3 ocr_gate.py --dir sheet --positive "$POSITIVE" --engine tesseract
          echo "──────────"
          python3 ocr_gate.py --dir sheet --positive "$POSITIVE" --engine tesseract --grid

      - name: rapidocr — СЫРЫЕ ЧИСЛА по кадрам (есть ли вообще граница)
        env:
          POSITIVE: ${{ inputs.positive }}
        run: python3 ocr_gate.py --dir sheet --positive "$POSITIVE" --dump

      - name: rapidocr (детектор регионов) — по файлам и сеткой
        env:
          POSITIVE: ${{ inputs.positive }}
        run: |
          python3 ocr_gate.py --dir sheet --positive "$POSITIVE" --engine rapidocr
          echo "──────────"
          python3 ocr_gate.py --dir sheet --positive "$POSITIVE" --engine rapidocr --grid
