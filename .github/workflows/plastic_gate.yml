name: Plastic Gate (отбраковка пластика из пула)

on:
  workflow_dispatch:
    inputs:
      pool:
        description: 'Путь пула от "Content factory/" (напр. cloud_io/qwen_pool/2026-06-26)'
        required: true
      threshold:
        description: 'Порог reject (score >= порога). Дефолт 55'
        default: '55'
      enforce:
        description: 'Двигать отбракованные в _rejected/ (1) или только отчёт (0)'
        default: '0'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing rclone ffmpeg
          pip install -q pillow
      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"
      - name: Run plastic_gate.py
        env:
          POOL:      ${{ inputs.pool }}
          THRESHOLD: ${{ inputs.threshold }}
          ENFORCE:   ${{ inputs.enforce }}
          CLOUDFLARE_WORKER:  ${{ secrets.CLOUDFLARE_WORKER }}
          WORKER_SECRET:      ${{ secrets.WORKER_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u plastic_gate.py
