name: Build Embeddings

# Вычисление SigLIP + librosa эмбеддингов клипов → LanceDB.
# Cyanite-подобный семантический поиск для подбора референсов по архетипу.
# Ручной запуск + после обновления каталога (fetch_media, board_fetch).
# Результат: .lance директория → артефакт → скачивается другими workflow.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Media"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: '3.11'

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing rclone

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dependencies
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers Pillow lancedb librosa numpy requests pyyaml

      - name: Build embeddings
        run: |
          python3 embeddings_pipeline.py --build
          python3 embeddings_pipeline.py --stats

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # was v7.0.1
        with:
          name: embeddings-lance
          path: embeddings.lance/
          retention-days: 90
