name: kimi chat bot

# Облачный бот @ghmimo_bot БЕЗ БУКА. Движок — Kimi (чистый HTTP, без браузера).
# CF Worker (mat3213-cloudbot /mimo) получает TG-вебхук → dispatch этого воркфлоу →
# Instrument/CnChat/kimi_chat.py считает задачу → ответ уходит в TG (текст + голос).
#
# История движка: mimo (мёртв 27.07, free-тир снят) → qwen-coder-gh (жив, но Playwright+Chromium,
# ~2.5-5 мин и одна сессия на весь пул) → Kimi: stdlib-only, ~10-15с, сессия до 27.10.2026.
# Память треда: ydrive:Content factory/cloud_io/mimo_bot/threads/<safe_key>.json (путь сохранён —
# бот тот же, история диалогов не теряется).
# Secrets в render-репо: YDRIVE_*, CLOUDFLARE_WORKER, MIMO_BOT_TOKEN.

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "TG chat_id"
        required: true
        type: string
      thread_id:
        description: "TG message_thread_id (пусто = нет)"
        required: false
        default: ""
        type: string
      message:
        description: "Сообщение пользователя"
        required: true
        type: string
      thread_key:
        description: "Ключ треда для памяти (chat_id:thread_id)"
        required: true
        type: string
      action:
        description: "chat (default) | clear (сброс контекста треда)"
        required: false
        default: "chat"
        type: string

permissions:
  contents: read      # Kimi = чат без инструментов: ни gh, ни git, ни dispatch. actions:write НЕ нужен.

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone + ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone ffmpeg

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      # ── ВЕТКА CLEAR: сбросить контекст треда ─────────────────────────────────
      - name: Clear thread context
        if: ${{ inputs.action == 'clear' }}
        env:
          CLOUDFLARE_WORKER: ${{ secrets.CLOUDFLARE_WORKER }}
          MIMO_BOT_TOKEN:    ${{ secrets.MIMO_BOT_TOKEN }}
          CHAT_ID:           ${{ inputs.chat_id }}
          THREAD_ID:         ${{ inputs.thread_id }}
          THREAD_KEY:        ${{ inputs.thread_key }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request

          key = os.environ["THREAD_KEY"]
          # per-thread файл (фикс гонки): один тред = один файл, удаляем только его
          def safe_key(k): return re.sub(r'[:/ ]+', '_', k).strip('_')
          remote = f"ydrive:Content factory/cloud_io/mimo_bot/threads/{safe_key(key)}.json"
          subprocess.run(["rclone", "delete", remote], capture_output=True)

          cf = os.environ.get("CLOUDFLARE_WORKER", "").rstrip("/")
          token = os.environ.get("MIMO_BOT_TOKEN", "")
          body = {"chat_id": os.environ.get("CHAT_ID", ""), "text": "🆕 Контекст сброшен. Новая задача."}
          thread_id = os.environ.get("THREAD_ID", "")
          if thread_id:
              body["message_thread_id"] = int(thread_id)
          req = urllib.request.Request(
              f"{cf}/bot{token}/sendMessage",
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "curl/7.88.1"}
          )
          try:
              urllib.request.urlopen(req, timeout=30)
              print("TG: контекст сброшен, ответ отправлен")
          except Exception as e:
              print(f"TG sendMessage err: {e}")
          PY

      # ── ВЕТКА CHAT ────────────────────────────────────────────────────────────
      # Ни pip, ни Playwright, ни Chromium: kimi_chat.py — stdlib-only, системного python3 достаточно.
      - name: Pull Kimi session from ydrive
        if: ${{ inputs.action != 'clear' }}
        run: |
          set -e
          rclone copyto "ydrive:Content factory/cloud_io/cnchat_ci/kimi_session.json" \
            Instrument/CnChat/kimi_session.json
          SIZE=$(stat -c%s Instrument/CnChat/kimi_session.json)
          echo "сессия Kimi: $SIZE б"
          # refresh_token живёт 90 дней и при обновлении НЕ ротируется (сервер отдаёт
          # только accessToken) → заливать сессию обратно на ЯД не нужно.
          [ "$SIZE" -gt 1000 ] || { echo "::error::сессия Kimi битая/пустая"; exit 1; }

      - name: Build prompt with thread context
        if: ${{ inputs.action != 'clear' }}
        env:
          THREAD_KEY: ${{ inputs.thread_key }}
          MESSAGE:    ${{ inputs.message }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          HIST_TURNS = 6
          HIST_ANS_CHARS = 1200
          BRIEF_CHARS = 8000
          # Промпт уходит АРГУМЕНТОМ командной строки, а один аргумент в Linux ограничен
          # 128 КБ (MAX_ARG_STRLEN) — упирались в это на зонде. Режем с запасом.
          PROMPT_CAP = 100000
          SB = "ydrive:Content factory/cloud_io/mimo_sandbox"

          def yd_read(remote, default=""):
              p = pathlib.Path("/tmp/" + remote.split("/")[-1])
              r = subprocess.run(["rclone", "copyto", remote, str(p)], capture_output=True)
              return p.read_text(encoding="utf-8", errors="replace") if (r.returncode == 0 and p.exists()) else default

          # Срез памяти проекта — полезный контекст (эстетика-табу, инструменты, инфра).
          # RULES.md намеренно НЕ впрыскиваем: это конституция песочницы с rclone/gh, а у Kimi
          # НЕТ инструментов (чат по HTTP) — обещать ему права = врать модели.
          brief  = yd_read(f"{SB}/PROJECT_BRIEF.md", "")[:BRIEF_CHARS]
          my_mem = yd_read(f"{SB}/MEMORY/notes.md", "")
          my_mem = "\n".join(my_mem.strip().splitlines()[-60:])   # только хвост, чтоб промпт не пух

          SPEAKER = "\U0001F50A"   # эмодзи-литерал в yml-heredoc на раннере не матчится — только escape
          PREAMBLE = (
              "Ты — Kimi, исполнитель задач yaromat в облаке (Telegram-бот проекта content_factory).\n"
              "Выполни ТЕКУЩУЮ ЗАДАЧУ и верни результат: код / расчёт / текст. По делу, без воды.\n"
              "У тебя НЕТ инструментов: ни shell, ни rclone, ни git, ни доступа к диску и репозиторию.\n"
              "Ты отвечаешь ТЕКСТОМ. Если для задачи нужна команда — напиши её, чтобы человек запустил.\n"
              "Не выдумывай, что якобы что-то выполнил. Если задача неясна — задай уточняющий вопрос.\n"
              "Отвечай на РУССКОМ.\n"
              "\n=== СРЕЗ ПАМЯТИ ПРОЕКТА ===\n" + brief
              + "\n\n=== ПАМЯТЬ БОТА (mimo_sandbox/MEMORY/notes.md) ===\n" + (my_mem or "(пусто)")
              + "\n\nВ САМОМ КОНЦЕ ответа добавь ОТДЕЛЬНУЮ строку, начинающуюся с '" + SPEAKER + " ' —\n"
              "краткое резюме сути для озвучки голосом: 1-2 простых предложения на русском,\n"
              "БЕЗ кода, команд, путей и технических деталей.\n"
          )

          key = os.environ["THREAD_KEY"]
          message = os.environ["MESSAGE"]

          # per-thread история (фикс гонки): читаем только файл этого треда
          def safe_key(k): return re.sub(r'[:/ ]+', '_', k).strip('_')
          th_remote = f"ydrive:Content factory/cloud_io/mimo_bot/threads/{safe_key(key)}.json"
          th_local = f"/tmp/_th_{safe_key(key)}.json"
          subprocess.run(["rclone", "copyto", th_remote, th_local], capture_output=True)
          hist = []
          if pathlib.Path(th_local).exists():
              try: hist = json.loads(pathlib.Path(th_local).read_text())[-HIST_TURNS:]
              except Exception: pass

          parts = [PREAMBLE]
          if hist:
              parts.append("\n=== Контекст прошлых шагов этого треда (для справки) ===")
              for i, turn in enumerate(hist, 1):
                  ans = (turn.get("a") or "")[:HIST_ANS_CHARS]
                  parts.append(f"[{i}] Задача: {turn.get('q', '')}\n    Результат: {ans}")
              parts.append("=== конец контекста ===\n")
          parts.append(f"ТЕКУЩАЯ ЗАДАЧА:\n{message}")
          prompt = "\n".join(parts)
          if len(prompt) > PROMPT_CAP:
              prompt = prompt[:PROMPT_CAP] + "\n[…промпт обрезан по лимиту аргумента]"
              print(f"::warning::промпт обрезан до {PROMPT_CAP} симв.")

          pathlib.Path("/tmp/prompt.txt").write_text(prompt, encoding="utf-8")
          print(f"Промпт: {len(prompt)} симв., история: {len(hist)} шагов, бриф: {len(brief)} симв.")
          PY

      - name: Run Kimi
        if: ${{ inputs.action != 'clear' }}
        id: run
        run: |
          # set +e ОБЯЗАТЕЛЕН: дефолтный shell у GH — bash -e, и ненулевой rc драйвера
          # оборвал бы шаг ДО отправки ответа в TG — пользователь получил бы тишину
          # вместо «❌ kimi: rc=...». Ровно этой болезнью и болел mimo_chat.yml.
          set +e
          mkdir -p /tmp/kimirun
          START=$(date +%s)
          timeout 900 python3 "$GITHUB_WORKSPACE/Instrument/CnChat/kimi_chat.py" \
            "$(cat /tmp/prompt.txt)" \
            --session "$GITHUB_WORKSPACE/Instrument/CnChat/kimi_session.json" \
            --timeout 300 \
            > /tmp/kimirun/clean.txt 2> /tmp/kimirun/err.txt </dev/null
          RC=$?
          END=$(date +%s)
          echo "RC=$RC ELAPSED=$((END-START)) BYTES=$(stat -c%s /tmp/kimirun/clean.txt)"
          tail -5 /tmp/kimirun/err.txt || true
          echo "rc=$RC"                 >> "$GITHUB_OUTPUT"
          echo "elapsed=$((END-START))" >> "$GITHUB_OUTPUT"
          exit 0

      # Детерминированный /close: рефлексию в память пишем САМИ, не полагаясь на free-LLM
      - name: Persist /close reflection
        if: ${{ inputs.action != 'clear' && contains(inputs.message, '/close') }}
        run: |
          python3 - <<'PY'
          import subprocess, datetime, pathlib
          clean = ""
          p = pathlib.Path("/tmp/kimirun/clean.txt")
          if p.exists():
              clean = p.read_text(encoding="utf-8", errors="replace").strip()
          rnotes = "ydrive:Content factory/cloud_io/mimo_sandbox/MEMORY/notes.md"
          lnotes = "/tmp/_notes_close.md"
          subprocess.run(["rclone", "copyto", rnotes, lnotes], capture_output=True)
          utc = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          entry = f"- [{utc}] /close: " + " ".join(clean[:200].split())
          lines = pathlib.Path(lnotes).read_text(encoding="utf-8").splitlines() if pathlib.Path(lnotes).exists() else []
          ins = 0
          for i, l in enumerate(lines):
              if l.lstrip().startswith(">"):   # после строки-подсказки (свежее сверху)
                  ins = i + 1
                  break
          lines.insert(ins, entry)
          pathlib.Path(lnotes).write_text("\n".join(lines) + "\n", encoding="utf-8")
          subprocess.run(["rclone", "copyto", lnotes, rnotes], capture_output=True)
          print(f"/close reflection persisted: {entry[:80]}")
          PY

      - name: Save context + send result to TG
        if: ${{ inputs.action != 'clear' }}
        env:
          CLOUDFLARE_WORKER: ${{ secrets.CLOUDFLARE_WORKER }}
          MIMO_BOT_TOKEN:    ${{ secrets.MIMO_BOT_TOKEN }}
          CHAT_ID:           ${{ inputs.chat_id }}
          THREAD_ID:         ${{ inputs.thread_id }}
          THREAD_KEY:        ${{ inputs.thread_key }}
          MESSAGE:           ${{ inputs.message }}
          RC:                ${{ steps.run.outputs.rc }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, urllib.request

          key = os.environ["THREAD_KEY"]
          message = os.environ["MESSAGE"]
          rc = os.environ.get("RC") or "1"
          cf = os.environ.get("CLOUDFLARE_WORKER", "").rstrip("/")
          token = os.environ.get("MIMO_BOT_TOKEN", "")
          chat_id = os.environ.get("CHAT_ID", "")
          thread_id = os.environ.get("THREAD_ID", "")

          clean = pathlib.Path("/tmp/kimirun/clean.txt")
          err   = pathlib.Path("/tmp/kimirun/err.txt")
          text = clean.read_text(encoding="utf-8", errors="replace").strip() if clean.exists() else ""
          ok = (rc == "0") and bool(text)

          if ok:
              resp = text
              def safe_key(k): return re.sub(r'[:/ ]+', '_', k).strip('_')
              th_remote = f"ydrive:Content factory/cloud_io/mimo_bot/threads/{safe_key(key)}.json"
              th_local = f"/tmp/_th_{safe_key(key)}.json"
              subprocess.run(["rclone", "copyto", th_remote, th_local], capture_output=True)
              hist = []
              if pathlib.Path(th_local).exists():
                  try: hist = json.loads(pathlib.Path(th_local).read_text())
                  except Exception: pass
              hist.append({"q": message, "a": resp[:1200]})
              hist = hist[-6:]
              pathlib.Path(th_local).write_text(json.dumps(hist, ensure_ascii=False))
              subprocess.run(["rclone", "copyto", th_local, th_remote], capture_output=True)
          else:
              err_text = (err.read_text(errors="replace")[-300:] if err.exists() else "")
              resp = f"❌ kimi: rc={rc} {err_text}".strip()

          # Отправляем в TG (чанками по 3900 симв.)
          for i in range(0, max(len(resp), 1), 3900):
              chunk = resp[i:i + 3900] or "(пусто)"
              body = {"chat_id": chat_id, "text": chunk}
              if thread_id:
                  body["message_thread_id"] = int(thread_id)
              req = urllib.request.Request(
                  f"{cf}/bot{token}/sendMessage",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json", "User-Agent": "curl/7.88.1"}
              )
              try:
                  urllib.request.urlopen(req, timeout=30)
                  print(f"TG ok (chunk {i // 3900 + 1})")
              except Exception as e:
                  print(f"TG err: {e}")
          PY

      # Краткая версия ответа голосом (edge-tts ru → ogg → sendVoice). Не критично: на ошибке молчим.
      - name: Send voice reply
        if: ${{ inputs.action != 'clear' && steps.run.outputs.rc == '0' }}
        env:
          MIMO_BOT_TOKEN: ${{ secrets.MIMO_BOT_TOKEN }}
          CHAT_ID:        ${{ inputs.chat_id }}
          THREAD_ID:      ${{ inputs.thread_id }}
        run: |
          pip install -q edge-tts requests || { echo "pip fail — пропуск голоса"; exit 0; }
          python3 - <<'PY'
          import os, re, asyncio, subprocess
          try:
              text = open("/tmp/kimirun/clean.txt", encoding="utf-8").read().strip()
          except Exception:
              text = ""
          if not text:
              print("нет текста для голоса"); raise SystemExit(0)
          # берём строку '\U0001F50A ...' если модель её дала, иначе весь текст без markdown-символов
          mark = "\U0001F50A"
          short = ""
          for line in text.splitlines():
              s = line.strip()
              if mark in s:
                  short = s.split(mark, 1)[1].strip(" :—-")
                  break
          if not short:
              src = re.sub(r"`+", " ", text)                 # убрать бэктики кода
              src = re.sub(r"[#|>*_]", " ", src)             # убрать markdown-символы (НЕ строки целиком)
              short = " ".join(src.split())[:220].strip()
          if not short:
              print("нет текста для озвучки"); raise SystemExit(0)
          print("VOICE short:", short[:80])
          try:
              import edge_tts
              asyncio.run(edge_tts.Communicate(short, "ru-RU-SvetlanaNeural").save("/tmp/reply.mp3"))
              subprocess.run(["ffmpeg", "-y", "-i", "/tmp/reply.mp3", "-c:a", "libopus",
                              "-b:a", "32k", "/tmp/reply.ogg"], check=True, capture_output=True)
          except Exception as e:
              print(f"TTS/ffmpeg err: {e}"); raise SystemExit(0)
          try:
              import requests
              # GH-раннер в США → api.telegram.org НЕ заблокирован, шлём multipart НАПРЯМУЮ
              # (CF Worker нужен только с RU-IP бука; здесь он лишний и давал 403 на multipart)
              data = {"chat_id": os.environ["CHAT_ID"]}
              tid = os.environ.get("THREAD_ID", "").strip()
              if tid:
                  data["message_thread_id"] = int(tid)
              with open("/tmp/reply.ogg", "rb") as fh:
                  r = requests.post(
                      f"https://api.telegram.org/bot{os.environ['MIMO_BOT_TOKEN']}/sendVoice",
                      data=data, files={"voice": ("reply.ogg", fh, "audio/ogg")}, timeout=60)
              print(f"sendVoice: {r.status_code} {r.text[:150]}")
          except Exception as e:
              print(f"sendVoice err: {e}")
          PY
