name: Fetch Media (runner-side, US-IP)

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: 'JSON list [{"url","type":"pexels|pinterest|direct","name"}]'
        required: true
      dest_folder:
        description: 'ЯД destination folder'
        required: false
        default: 'Content factory/cloud_io/runner_fetch/batch'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # was v7.0.0
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -q requests yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y --fix-missing ffmpeg rclone

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Fetch and upload
        env:
          URLS_JSON:       ${{ inputs.urls_json }}
          DEST_FOLDER:     ${{ inputs.dest_folder }}
        run: python fetch_runner.py
