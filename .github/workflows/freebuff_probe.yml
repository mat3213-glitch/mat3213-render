name: Freebuff Probe (установка/запуск на US-IP)

# Freebuff (freebuff.com, CodebuffAI) — «free coding agent». Разведка 06.10.
# С бука не годится: codebuff.com проходит TCP, но TLS-хендшейк не завершается
# (60 с, 0 байт). Тут раннер США — проверяем, тянет ли пакет + бинарь + не-интерактив.
# Ничего не публикуем и не коммитим: только логи.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Пробный промпт (пусто = только установка и версия)"
        required: false
        type: string
      model:
        description: "Модель из каталога (пусто = дефолт)"
        required: false
        type: string
      force_baseline:
        description: "1 = форснуть linux-x64-baseline (бук/CPU без AVX2)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - name: Reachability (TLS до codebuff.com)
        run: |
          set +e
          for host in codebuff.com freebuff.com; do
            curl -sS -o /dev/null --max-time 25 \
              -w "$host: code=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
              "https://$host/"
            echo "  rc=$?"
          done
          set -e

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # was v4
        with:
          node-version: "20"

      - name: Установить freebuff (npm) и скачать бинарь
        env:
          FORCE_BASELINE: ${{ inputs.force_baseline }}
        run: |
          set +e
          npm install -g freebuff 2>&1 | tail -5
          echo "npm rc=$?"
          which freebuff
          if [ "$FORCE_BASELINE" = "1" ]; then
            export FREEBUFF_BINARY_TARGET=linux-x64-baseline
            echo "форснули linux-x64-baseline"
          fi
          # Сам лаунчер и есть установка: он качает прекомпилированный бинарь с codebuff.com
          freebuff --version 2>&1 | tail -20
          echo "version rc=$?"
          set -e

      - name: Что скачалось
        run: |
          du -sh ~/.freebuff ~/.config/freebuff ~/.codebuff 2>/dev/null || true
          ls -la ~/.freebuff/bin 2>/dev/null || true
          df -h / | tail -1

      - name: Не-интерактивный пробный запрос
        if: ${{ inputs.prompt != '' }}
        env:
          PROMPT: ${{ inputs.prompt }}
          MODEL: ${{ inputs.model }}
        run: |
          set +e
          mkdir -p /tmp/fbwork && cd /tmp/fbwork
          git init -q . && echo hello > README.md && git add -A && git -c user.email=a@b -c user.name=c commit -qm init
          ARGS=()
          [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
          # таймаут наружу: агент интерактивный и может зависнуть в ожидании ввода
          timeout 420 freebuff "$@" "${ARGS[@]}" <<< "$PROMPT" 2>&1 | tail -60
          echo "prompt rc=$?"
          set -e