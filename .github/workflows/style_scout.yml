name: Style Scout

on:
  schedule:
    - cron: "0 11 * * *"   # ЕЖЕДНЕВНО 11:00 UTC (срочный набор качества; GH может задерживать)
  workflow_dispatch:
    inputs:
      per_query:
        description: "кадров на запрос"
        default: "3"
      limit:
        description: "макс кандидатов после дедупа"
        default: "6"

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # was v7.0.0
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing ffmpeg rclone

      - name: Install python deps
        run: pip install -q numpy pillow requests

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Run style scout
        env:
          CLOUDFLARE_WORKER:     ${{ secrets.CLOUDFLARE_WORKER }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STYLE_SCOUT_CHAT_ID:   ${{ secrets.SCOUT_CHAT_ID }}   # та же группа @yaromat
          STYLE_SCOUT_THREAD_ID: "634"                          # тема «STYLE SCOUT»
          PER_QUERY:             ${{ github.event.inputs.per_query || '3' }}
          LIMIT:                 ${{ github.event.inputs.limit || '6' }}
        run: python style_scout.py --per-query "$PER_QUERY" --limit "$LIMIT"

      - name: Judge candidates (CF + OpenRouter vision)
        env:
          CLOUDFLARE_WORKER:     ${{ secrets.CLOUDFLARE_WORKER }}
          WORKER_SECRET:         ${{ secrets.WORKER_SECRET }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STYLE_SCOUT_CHAT_ID:   ${{ secrets.SCOUT_CHAT_ID }}
          STYLE_SCOUT_THREAD_ID: "634"
        run: python style_judge.py

      - name: Commit proposals + judge
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add style_proposals.json
          [ -f style_judge.json ] && git add style_judge.json || echo "no judge output"
          if git diff --cached --quiet; then
            echo "no proposals change"
          else
            git commit -m "style-scout: new candidates + vision judge [skip ci]"
            git push
          fi
