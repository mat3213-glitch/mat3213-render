name: Vinyl Teaser

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (e.g. 2026-06-04_vinyl_square)'
        required: true

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "BLOCKED: vinyl treatment is prohibited by the current creative contract."
          exit 1
  render:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: '3.11'

      - name: Cache apt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # was v4
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-rclone-fonts-${{ runner.os }}-v1

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing ffmpeg rclone fonts-dejavu-core

      - name: Install Python deps
        run: pip install Pillow

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Run vinyl_job.py
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: python -u vinyl_job.py

      - name: Write error status on failure
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          rclone rcat "ydrive:Content factory/cloud_io/render_jobs/$JOB_ID/status.txt" \
            <<< "error: workflow failed" || true
