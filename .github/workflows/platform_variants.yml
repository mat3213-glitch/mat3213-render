name: Prepare platform variants

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Full vertical video path relative to Content factory/"
        required: true
        type: string
      slug:
        description: "Queue slug (letters, digits, underscore, hyphen)"
        required: true
        type: string
      title:
        description: "Publication title"
        required: true
        type: string
      sections:
        description: "Number of equal Shorts sections"
        required: false
        type: string
        default: "4"
      shorts_platforms:
        description: "Comma-separated platforms that receive Shorts (vk,youtube,ok)"
        required: false
        type: string
        default: "youtube"
      full_platforms:
        description: "Comma-separated platforms that receive the full 720p cut (tg,vk,ok); 'none' = skip full"
        required: false
        type: string
        default: "none"
      caption:
        description: "Post caption (fb-цитата + трек)"
        required: false
        type: string
        default: "никто не придёт. это и есть взросление.\nyaromat — взрослый\nвключи звук"

permissions:
  contents: read

concurrency:
  group: publish_media_${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install ffmpeg and rclone
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg rclone
      - name: Configure Yandex Disk
        env:
          YDRIVE_CLIENT_ID: ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN: ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" > "$HOME/.config/rclone/rclone.conf"
      - name: Encode variants and queue them
        env:
          SOURCE: ${{ inputs.source }}
          SLUG: ${{ inputs.slug }}
          TITLE: ${{ inputs.title }}
          SECTIONS: ${{ inputs.sections }}
          SHORTS_PLATFORMS: ${{ inputs.shorts_platforms }}
          FULL_PLATFORMS: ${{ inputs.full_platforms }}
          CAPTION: ${{ inputs.caption }}
        run: |
          set -euo pipefail
          mkdir -p out
          upload(){ local s=$1 d=$2; for a in 1 2 3; do
            rclone copyto --checkers 2 --transfers 2 --low-level-retries 4 --retries 3 "$s" "$d" && return 0
            echo "↻ upload retry $a" >&2; sleep $((10*a)); done; return 1; }
          upload "ydrive:Content factory/$SOURCE" source.mp4
          # Equal sections stay short enough for Shorts/VK Clips.
          total=$(ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4)
          nsec="$SECTIONS"
          section=$(python3 -c 'import sys; print(float(sys.argv[1]) / int(sys.argv[2]))' "$total" "$nsec")
          for n in $(seq 1 "$nsec"); do
            start=$(python3 -c 'import sys; print((int(sys.argv[1])-1)*float(sys.argv[2]))' "$n" "$section")
            ffmpeg -y -loglevel error -ss "$start" -t "$section" -i source.mp4 \
              -vf 'scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920' \
              -c:v libx264 -crf 22 -preset medium -c:a aac -b:a 160k -pix_fmt yuv420p \
              -movflags +faststart "out/${SLUG}_section_${n}.mp4"
          done
          base="Content factory/cloud_io/publish_queue/media/${SLUG}"
          for n in $(seq 1 "$nsec"); do
            upload "out/${SLUG}_section_${n}.mp4" "ydrive:${base}/${SLUG}_section_${n}.mp4"
          done
          if [ "$FULL_PLATFORMS" != "none" ] && [ -n "$FULL_PLATFORMS" ]; then
            ffmpeg -y -loglevel error -i source.mp4 \
              -vf 'scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2' \
              -c:v libx264 -preset medium -b:v 550k -maxrate 600k -bufsize 1200k \
              -c:a aac -b:a 48k -pix_fmt yuv420p -movflags +faststart "out/${SLUG}_full_720.mp4"
            upload "out/${SLUG}_full_720.mp4" "ydrive:${base}/${SLUG}_full_720.mp4"
          fi
          # Общий writer очереди: НЕ правим queue.json сами. Собираем items →
          # submit кладёт уникально-именованный патч в queue.d/ (нет lost update),
          # reconcile — единственный writer queue.json (идемпотентный детерминированный fold).
          python3 - "$SLUG" "$TITLE" "$CAPTION" "$SECTIONS" "$SHORTS_PLATFORMS" "$FULL_PLATFORMS" <<'PY'
          import json, sys
          slug, title, caption = sys.argv[1:4]
          nsec = int(sys.argv[4])
          shorts_platforms = [p for p in sys.argv[5].split(",") if p and p not in ("", "none")]
          full_platforms = [p for p in sys.argv[6].split(",") if p and p not in ("", "none")]
          items = []
          for platform in full_platforms:
              items.append({"platform": platform, "entry": {"id": f"{slug}_{platform}",
                            "media": f"{slug}/{slug}_full_720.mp4", "type": "video",
                            "caption": caption, "own_track": True}})
          for n in range(1, nsec + 1):
              for platform in shorts_platforms:
                  if platform == "youtube":
                      items.append({"platform": platform, "entry": {
                          "id": f"{slug}_short_{n}", "media": f"{slug}/{slug}_section_{n}.mp4",
                          "type": "video", "title": f"{title} · часть {n}/{nsec} #Shorts",
                          "description": caption + f"\n\n#Shorts #futuregarage #downtempo #yaromat",
                          "own_track": True}})
                  else:
                      items.append({"platform": platform, "entry": {
                          "id": f"{slug}_{platform}_short_{n}", "media": f"{slug}/{slug}_section_{n}.mp4",
                          "type": "video", "caption": caption, "own_track": True}})
          json.dump({"items": items}, open("items.json", "w"), ensure_ascii=False, indent=2)
          PY
          QUEUE_DST="Content factory/cloud_io/publish_queue/queue.json"
          python3 queue_enqueue.py submit --queue-dst "$QUEUE_DST" --slug "$SLUG" --items-file items.json
          # The dedicated workflow_run reconciler consumes durable patches.
          # This producer never writes queue.json.
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/${SLUG}_section_1.mp4
          ls -lh out/
