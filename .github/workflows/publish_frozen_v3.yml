name: Publish frozen v3 preview (VK + YT shorts)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Full vertical video path relative to Content factory/"
        required: true
        type: string
        default: "cloud_io/render_jobs/2026-09-02_frozen_space/frozen_space_vertical.mp4"
      slug:
        description: "Queue slug (letters, digits, underscore, hyphen)"
        required: true
        type: string
        default: "frozen_v3"
      title:
        description: "Publication title"
        required: true
        type: string
        default: "yaromat — Frozen Space"

permissions:
  contents: read

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install ffmpeg and rclone
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg rclone
      - name: Configure Yandex Disk
        env:
          YDRIVE_CLIENT_ID: ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN: ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" > "$HOME/.config/rclone/rclone.conf"
      - name: Cut 4 Shorts + queue frozen v3 (VK full already on YaD)
        env:
          SOURCE: ${{ inputs.source }}
          SLUG: ${{ inputs.slug }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          mkdir -p out
          base="Content factory/cloud_io/publish_queue/media/${SLUG}"
          MEDIA_DIR="ydrive:${base}"
          # Idempotent: use the already-uploaded full file if present, else upload source preview as VK full.
          if ! rclone lsf "$MEDIA_DIR/${SLUG}_full.mp4" 2>/dev/null | grep -q .; then
            echo "full file missing, uploading source preview as VK full"
            rclone copyto "ydrive:Content factory/$SOURCE" "$MEDIA_DIR/${SLUG}_full.mp4"
          fi
          # Source for cutting = already-uploaded full file (no re-download of original).
          rclone copyto "$MEDIA_DIR/${SLUG}_full.mp4" source.mp4
          total=$(ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4)
          section=$(python3 -c 'import sys; print(float(sys.argv[1]) / 4.0)' "$total")
          for n in 1 2 3 4; do
            start=$(python3 -c 'import sys; print((int(sys.argv[1])-1)*float(sys.argv[2]))' "$n" "$section")
            ffmpeg -y -loglevel error -ss "$start" -t "$section" -i source.mp4 \
              -vf 'scale=-1:1920' -c:v libx264 -crf 22 -preset medium -c:a aac -b:a 160k -pix_fmt yuv420p \
              -movflags +faststart "out/${SLUG}_section_${n}.mp4"
          done
          for n in 1 2 3 4; do
            rclone copyto "out/${SLUG}_section_${n}.mp4" "$MEDIA_DIR/${SLUG}_section_${n}.mp4"
          done
          rclone copyto "ydrive:Content factory/cloud_io/publish_queue/queue.json" queue.json
          python3 - "$SLUG" "$TITLE" <<'PY'
          import json, sys
          slug, title = sys.argv[1:]
          q = json.load(open("queue.json"))
          caption = "тишина — это не пустота. внутри всегда есть точка покоя.\n\nyaromat — Frozen Space\nвключи звук"
          vk_id = f"{slug}_vk"
          q.setdefault("vk", [])
          if not any(x.get("id") == vk_id for x in q["vk"]):
              q["vk"].append({"id": vk_id, "media": f"{slug}/{slug}_full.mp4",
                              "type": "video", "caption": caption, "own_track": True})
          q.setdefault("youtube", [])
          for n in range(1, 5):
              item_id = f"{slug}_short_{n}"
              if not any(x.get("id") == item_id for x in q["youtube"]):
                  q["youtube"].append({
                      "id": item_id,
                      "media": f"{slug}/{slug}_section_{n}.mp4",
                      "type": "video", "title": f"{title} · часть {n}/4 #Shorts",
                      "description": caption + f"\n\n#Shorts #futuregarage #downtempo #yaromat",
                      "own_track": True})
          json.dump(q, open("queue.json", "w"), ensure_ascii=False, indent=2)
          PY
          rclone copyto queue.json "ydrive:Content factory/cloud_io/publish_queue/queue.json"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/${SLUG}_section_1.mp4
          ls -lh out/
