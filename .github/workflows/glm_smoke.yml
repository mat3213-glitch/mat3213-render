name: glm smoke (xvfb headed US-check)

# Разовый диагностический smoke-тест GLM-воркера (chat.z.ai) с US-IP GH-раннера.
# Цель: понять, CAPTCHA это фингерпринт/headless-специфика бука или IP-зависимость,
# и работает ли свежая сессия (залита с бука в ydrive) headless за границей.
# Сессия тянется с ЯД, в git НЕ хранится.
# Результат: DOM+скрин последнего состояния (артефакт) + короткий вердикт в job-log.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Промпт для smoke-ответа"
        required: false
        default: "ответь одним словом: готов"
        type: string
      model:
        description: "Модель (GLM-5.3 | GLM-5.3-Flash | пусто=текущая)"
        required: false
        default: "GLM-5.3"
        type: string
      timeout:
        description: "Таймаут ожидания ответа, сек"
        required: false
        default: "150"
        type: string

concurrency:
  group: glm-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - name: Install deps
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.54.0"
          google-chrome --version || python3 -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone xvfb

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Pull fresh GLM session from ydrive
        run: |
          set -e
          rclone copyto "ydrive:Content factory/cloud_io/cnchat_ci/glm_session.json" \
            Instrument/GLM/glm_session.json
          SIZE=$(stat -c%s Instrument/GLM/glm_session.json)
          echo "сессия GLM: $SIZE б"
          [ "$SIZE" -gt 1000 ] || { echo "::error::сессия GLM битая/пустая"; exit 1; }
          python3 - <<'PY'
          import json
          st = json.load(open("Instrument/GLM/glm_session.json"))
          cz = [c for c in st.get("cookies", []) if "z.ai" in c.get("domain", "")]
          print(f"кук z.ai: {len(cz)}")
          print(f"домены: {sorted({c['domain'] for c in st.get('cookies', [])})}")
          origins = len(st.get("origins", []))
          print(f"origins: {origins} (localStorage/keyValues)")
          PY

      - name: Run xvfb headed smoke
        id: run
        run: |
          set +e
          mkdir -p /tmp/glmout
          GLM_HEADLESS=0 timeout 540 xvfb-run -a -s "-screen 0 1280x900x24" \
            python3 Instrument/GLM/glm_chat.py "${{ inputs.prompt }}" \
            --model "${{ inputs.model }}" --timeout ${{ inputs.timeout }} \
            > /tmp/glmout/stdout.txt 2> /tmp/glmout/stderr.txt
          RC=$?
          echo "RC=$RC"
          echo "--- stdout ---"; cat /tmp/glmout/stdout.txt
          echo "--- stderr ---"; cat /tmp/glmout/stderr.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Collect screenshots + DOM
        run: |
          mkdir -p /tmp/glmout/artifacts
          cp "$GITHUB_WORKSPACE"/Instrument/GLM/outputs/*.png /tmp/glmout/artifacts/ 2>/dev/null || true
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("Instrument/GLM/glm_session.json")
          if p.exists():
              # не выкладываем куки/токены в артефакт — только имена+длины, для диагностики
              st = json.loads(p.read_text())
              names = sorted({f"{c['name']}({len(c['value'])})"
                              for c in st.get("cookies", []) if "z.ai" in c.get("domain", "")})
              pathlib.Path("/tmp/glmout/artifacts/cookie_names.txt").write_text(
                  "z.ai cookies: " + ", ".join(names) + "\n", encoding="utf-8")
          PY
          echo "--- стдout бойца ---"; cat /tmp/glmout/stdout.txt; echo

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # was v7.0.1
        with:
          name: glm-smoke-screens
          path: /tmp/glmout/artifacts/
          if-no-files-found: warn
          retention-days: 7