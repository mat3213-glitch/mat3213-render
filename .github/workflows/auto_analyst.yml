name: auto analyst (repo/site)

# Автономная облачная система анализа-теста репо/сайтов по рубрике пользы.
# Полностью в облаке (GH Actions), исполнитель — Kimi-чат на раннере (K2.5 через
# stdlib urllib). [2026-07-27] переехал с mimo (снят free-тариф) на Qwen; [2026-10-06]
# Qwen-текст заблокирован Aliyun WAF-капчей → Kimi, Qwen остался фолбэком
# (ANALYST_TEXT_WORKER=qwen|auto). FAN-OUT через matrix, ПОСЛЕДОВАТЕЛЬНО (max-parallel 1:
# один аккаунт воркера). Каждая цель → verified_tools/<slug>/ на ЯД + отчёт в TG-тред.
# Финал «внедряем/нет» — за yaromat. Решения хранятся в ADOPTION_BOARD.md.
#
# Честность отчётов: упавший текстовый воркер = score null + маркер ANALYSIS_ERROR
# и красный ран, а не «0/100 — мимо». Ноль читается как честный отказ.
#
# Триггеры:
#   - workflow_dispatch(targets) — дроп вручную (или из бота по очереди ЯД)
#   - schedule — АВТОНОМНО раз в неделю: из очереди ЯД + находок repo_scout (без человека/ИИ)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "URL через пробел (пусто = взять из очереди ЯД analyst_queue/pending/)"
        required: false
        type: string
      thread:
        description: "TG-тред разборов (1653=GROK SCOUT, 1699=REPO SCOUT; пусто=1653)"
        required: false
        type: string
  schedule:
    - cron: "0 9 * * 1"   # пн 09:00 UTC — автономный проход

permissions:
  contents: read

concurrency:
  group: analyst-text-worker-session
  cancel-in-progress: false

jobs:
  # ── 1. План: собрать цели → matrix ────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - name: Deps
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone && pip install -q pyyaml
      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"
      - name: Collect targets → matrix
        id: set
        env:
          TARGETS: ${{ inputs.targets }}
          EVENT:   ${{ github.event_name }}
        run: |
          ARGS=()
          if [ -n "$TARGETS" ]; then ARGS+=(--targets "$TARGETS"); fi
          if [ "$EVENT" = "schedule" ]; then ARGS+=(--from-queue); fi   # repo_scout сам гонит свои находки (свой тред)
          if [ ${#ARGS[@]} -eq 0 ]; then ARGS+=(--from-queue); fi
          OUT=$(python3 auto_analyst.py --list-targets "${ARGS[@]}")
          echo "targets: $OUT"
          echo "matrix=$OUT" >> "$GITHUB_OUTPUT"

  # ── 2. Анализ: fan-out через matrix, 1 раннер+Qwen на цель (последовательно) ──────
  analyze:
    needs: plan
    if: needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    # 05.10: джобы по 36-67 мин висели в очереди GH и падали «job was not acquired by
    # Runner», а финальная board-джоба успевала отмениться по общему таймауту — доска
    # не пересобиралась вообще. С Kimi один разбор занимает минуты, поэтому короткий
    # лимит: зависший воркер должен умереть быстро, а не съедать окно прогона.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1   # один аккаунт текстового воркера → строго последовательно
      matrix:
        target: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - name: Deps
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone && pip install -q pyyaml
      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"
      - name: Setup text worker (Kimi by default, Qwen fallback)
        # [2026-10-06] Текстовый воркер переведён на Kimi: chat.qwen.ai заблокирован
        # Aliyun WAF-капчей (возрастной гейт + logged-out маркер в профиле), из-за чего
        # с 23.09 каждый разбор падал в ANALYSIS_ERROR и доска/TG показывали нули.
        # Kimi — чистый stdlib urllib: ни Chromium, ни профиль. Qwen оставлен фолбэком
        # (ANALYST_TEXT_WORKER=qwen|auto), его окружение ставится только тогда.
        env:
          ANALYST_TEXT_WORKER: ${{ vars.ANALYST_TEXT_WORKER || 'kimi' }}
        run: |
          set -e
          mkdir -p kimi
          rclone copyto "ydrive:Content factory/cloud_io/cnchat_ci/kimi_session.json" \
            kimi/kimi_session.json
          SIZE=$(stat -c%s kimi/kimi_session.json)
          if [ "$SIZE" -lt 5000 ]; then
            echo "::error::сессия Kimi битая/пустая ($SIZE б) — анализатор без текстового воркера"
            exit 1
          fi
          if [ "$ANALYST_TEXT_WORKER" != "kimi" ]; then
            rclone copyto "ydrive:Content factory/cloud_io/qwen_ci/qwen_session.json" qwen/qwen_session.json
            pip install -q requests playwright
            python -m playwright install --with-deps chromium
          fi
      - name: Analyze target
        env:
          CLOUDFLARE_WORKER:   ${{ secrets.CLOUDFLARE_WORKER }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCOUT_CHAT_ID:       ${{ secrets.SCOUT_CHAT_ID }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          SCOUT_THREAD:        ${{ inputs.thread }}
          ANALYST_TEXT_WORKER: ${{ vars.ANALYST_TEXT_WORKER || 'kimi' }}
          KIMI_SESSION_FILE:   ${{ github.workspace }}/kimi/kimi_session.json
        run: python3 auto_analyst.py --targets "${{ matrix.target }}"
      - name: Report to memory_os feed
        if: always()
        run: python3 memos_emit.py gh-ai auto_analyst ${{ job.status }} "target=${{ matrix.target }}"

  # ── 3. Доска: собрать ADOPTION_BOARD из всех report.json (без гонки) ──────────────
  board:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - name: Deps
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone && pip install -q pyyaml
      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"
      - name: Rebuild adoption board
        env:
          CLOUDFLARE_WORKER:   ${{ secrets.CLOUDFLARE_WORKER }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCOUT_CHAT_ID:       ${{ secrets.SCOUT_CHAT_ID }}
        run: python3 auto_analyst.py --rebuild-board
