name: s2c daily (signals -> qwen -> worker)

# Автономный цикл Signal-to-Channel «ИИшница» на GH-раннере (бук не участвует):
# HN-сигналы -> фильтр по профилю -> Qwen (US-IP) -> Cloudflare Worker POST /add
# -> модерация с кнопками в ЛС владельца -> публикация в канале (Worker+KV).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
    - cron: "0 22 * * *"
  # 06:00/14:00/22:00 UTC = 13:00/21:00/05:00 НСК — 3 раза/сутки   # 06:00/14:00/22:00 UTC = 13:00/21:00/05:00 НСК — 3 раза/сутки

concurrency:
  group: qwen-shared-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: "3.11"

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Pull Qwen session + dedup state
        run: |
          rclone copyto "ydrive:Content factory/cloud_io/qwen_ci/qwen_session.json" qwen/qwen_session.json
          rclone copyto "ydrive:Content factory/cloud_io/s2c/state.json" s2c_state.json || true

      - name: Install Playwright
        run: |
          pip install -q requests playwright
          python -m playwright install --with-deps chromium

      - name: Dump TG HTML structure
        run: |
          curl -s --max-time 15 "https://t.me/s/neuraldvig" > /tmp/tg_sample.html
          echo "=== tgme classes ==="
          grep -oP 'class="[^"]*tgme[^"]*"' /tmp/tg_sample.html | sort -u | head -20
          echo "=== post links ==="
          grep -oP 'href="https://t\.me/neuraldvig/\d+"' /tmp/tg_sample.html | head -5
          echo "=== message text blocks ==="
          python3 -c "
          import re
          h=open('/tmp/tg_sample.html').read()
          blocks=re.findall(r'class=\"tgme_widget_message_wrap[^"]*\"[^>]*>(.*?)</div>\s*</div>\s*</div>', h, re.S)
          print(f'wrap blocks: {len(blocks)}')
          texts=re.findall(r'<div class=\"tgme_widget_message_text[^"]*\"[^>]*>(.*?)</div>', h, re.S)
          print(f'text blocks: {len(texts)}')
          for t in texts[:2]:
              c=re.sub(r'<[^>]+>','',t).strip()[:150]
              print(f'  > {c}')
          "

      - name: Run s2c daily cycle
        env:
          S2C_WORKER_SECRET: ${{ secrets.S2C_WORKER_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 s2c_daily.py
