name: s2c daily (signals -> text worker -> channel)

# Автономный цикл Signal-to-Channel «ИИшница» на GH-раннере (бук не участвует):
# HN-сигналы -> фильтр по профилю -> текстовый воркер (Kimi, фолбэк Qwen) ->
# Cloudflare Worker POST /add -> модерация с кнопками в ЛС владельца ->
# публикация в канале (Worker+KV).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and select sources without generating or sending drafts"
        required: false
        type: boolean
        default: false
      image_test:
        description: "Test one live news illustration, without sending a Telegram draft"
        required: false
        type: boolean
        default: false
      image_test_style:
        description: "Style for manual image test only"
        required: false
        type: choice
        options:
          - current
          - who-does-what-flat
        default: current
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
    - cron: "0 22 * * *"
  # 06:00/14:00/22:00 UTC = 13:00/21:00/05:00 НСК — 3 раза/сутки   # 06:00/14:00/22:00 UTC = 13:00/21:00/05:00 НСК — 3 раза/сутки

concurrency:
  group: qwen-shared-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: "3.11"

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y --fix-missing rclone

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Pull Kimi session + Qwen session/profile (fallback) + dedup state
        env:
          S2C_TEXT_WORKER: ${{ vars.S2C_TEXT_WORKER || 'kimi' }}
        run: |
          mkdir -p kimi
          rclone copyto "ydrive:Content factory/cloud_io/cnchat_ci/kimi_session.json" \
            kimi/kimi_session.json
          SIZE=$(stat -c%s kimi/kimi_session.json)
          if [ "$SIZE" -lt 5000 ]; then
            echo "::error::сессия Kimi битая/пустая ($SIZE б) — s2c без текстового воркера"
            exit 1
          fi
          echo "Kimi-сессия: $SIZE б (текстовый воркер: $S2C_TEXT_WORKER)"
          # Qwen остаётся фолбэком (S2C_TEXT_WORKER=qwen|auto) — тянем только когда нужен.
          if [ "$S2C_TEXT_WORKER" != "kimi" ]; then
            rclone copyto "ydrive:Content factory/cloud_io/qwen_ci/qwen_profile.tar.gz" qwen/qwen_profile.tar.gz
            mkdir -p qwen/qwen_profile
            tar xzf qwen/qwen_profile.tar.gz -C qwen/qwen_profile
            rclone copyto "ydrive:Content factory/cloud_io/qwen_ci/qwen_session.json" qwen/qwen_session.json
          fi
          rclone copyto "ydrive:Content factory/cloud_io/s2c/state.json" s2c_state.json || true

      - name: Install Playwright (only for the Qwen fallback path)
        env:
          S2C_TEXT_WORKER: ${{ vars.S2C_TEXT_WORKER || 'kimi' }}
        run: |
          if [ "$S2C_TEXT_WORKER" = "kimi" ]; then
            echo "текстовый воркер = Kimi (stdlib urllib) — Chromium не нужен"
            exit 0
          fi
          pip install -q requests playwright yt-dlp
          python -m playwright install --with-deps chromium

      - name: Install isolated Signals image checks
        run: |
          python -m venv .s2c-image-venv
          .s2c-image-venv/bin/pip install -q -r requirements-s2c-images.txt
          .s2c-image-venv/bin/python -m unittest test_s2c_daily test_s2c_images
          .s2c-image-venv/bin/python s2c_images.py

      - name: Pull Signals image cache
        run: |
          mkdir -p s2c_image_cache
          rclone copy "ydrive:Content factory/cloud_io/s2c/image_cache" s2c_image_cache || echo "::warning::Signals image cache unavailable; will generate if needed"

      - name: Run s2c daily cycle
        env:
          S2C_WORKER_SECRET: ${{ secrets.S2C_WORKER_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          S2C_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          S2C_IMAGE_TEST: ${{ inputs.image_test || 'false' }}
          S2C_IMAGE_TEST_STYLE: ${{ inputs.image_test_style || 'current' }}
          S2C_TEXT_WORKER: ${{ vars.S2C_TEXT_WORKER || 'kimi' }}
          KIMI_SESSION_FILE: ${{ github.workspace }}/kimi/kimi_session.json
        run: |
          if [ "$S2C_DRY_RUN" = "true" ]; then
            .s2c-image-venv/bin/python s2c_daily.py --dry-run
          elif [ "$S2C_IMAGE_TEST" = "true" ]; then
            if [ "$S2C_IMAGE_TEST_STYLE" = "who-does-what-flat" ]; then
              .s2c-image-venv/bin/python s2c_image_poster_test.py
            else
              .s2c-image-venv/bin/python s2c_image_smoke.py
            fi
          else
            .s2c-image-venv/bin/python s2c_daily.py
          fi

      - name: Persist Signals image cache
        if: always()
        run: |
          if [ -d s2c_image_cache ]; then
            rclone copy s2c_image_cache "ydrive:Content factory/cloud_io/s2c/image_cache"
          fi

      - name: Push Qwen profile back to ЯД (only on the fallback path)
        if: always()
        run: |
          if [ ! -d qwen/qwen_profile ]; then echo "::warning::Qwen-профиль не использовался — нечего заливать"; exit 0; fi
          tar czf qwen_profile.tar.gz -C qwen/qwen_profile \
            --exclude='Cache' --exclude='Code Cache' --exclude='GPUCache' \
            --exclude='DawnWebGPUCache' --exclude='DawnGraphiteCache' \
            --exclude='GrShaderCache' --exclude='ShaderCache' \
            --exclude='GraphiteDawnCache' --exclude='BrowserMetrics-spare.pma' \
            --exclude='Safe Browsing' --exclude='segmentation_platform' . || exit 0
          SIZE=$(stat -c%s qwen_profile.tar.gz)
          if [ "$SIZE" -lt 1000 ]; then echo "::warning::профиль подозрительно мал ($SIZE б) — не заливаю"; exit 0; fi
          rclone copyto qwen_profile.tar.gz "ydrive:Content factory/cloud_io/qwen_ci/qwen_profile.tar.gz"
          rclone copyto qwen/qwen_session.json "ydrive:Content factory/cloud_io/qwen_ci/qwen_session.json" || true
          echo "профиль залит обратно на ЯД ($SIZE б)"

      - name: Keep image smoke evidence
        if: always() && inputs.image_test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s2c-image-smoke
          path: s2c_image_smoke_output/
          if-no-files-found: warn
          retention-days: 7

