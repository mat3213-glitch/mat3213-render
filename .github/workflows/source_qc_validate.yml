name: source-qc-validate

# Регресс-проверка двухфакторного пре-гейта source_qc (L4): часы НЕ реджектятся,
# силуэты проходят как фигуры. Ручной запуск.
on:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # was v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libgl1 libglib2.0-0
          # rapidocr-onnxruntime + pillow: source_qc теперь судит и надпись в кадре,
          # регресс обязан гонять гейт по-настоящему, а не через fail-open
          pip install --quiet supervision ultralytics huggingface_hub numpy pillow rapidocr-onnxruntime
          (sudo apt-get update -qq && sudo apt-get install -y -qq rclone)

      - name: Configure rclone (ЯД / ydrive)
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [ydrive]
          type = yandex
          client_id = ${YDRIVE_CLIENT_ID}
          client_secret = ${YDRIVE_CLIENT_SECRET}
          token = ${YDRIVE_TOKEN}
          EOF

      - name: Validate source_qc
        working-directory: screenplay_pipeline
        run: python source_qc_validate.py
