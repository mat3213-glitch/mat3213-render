name: SP Scene Gen — LTX i2v (Kaggle GPU)

# Screenplay-pipeline Фаза 1, Стадия 4: генерация ОДНОЙ сцены через LTX-Video 0.9.5.
# Заведён 2026-07-28 после теста физики: единственный живой self-host i2v.
#
# ПОЧЕМУ ЧЕРЕЗ KAGGLE: LTX нужен GPU, а у GH-раннеров его нет. Раннер здесь = дирижёр:
# готовит стилл, собирает ноутбук, толкает его на бесплатный Kaggle GPU (P100/T4),
# ждёт, забирает mp4 и кладёт на ЯД. Сам считать нечего — CPU почти простаивает.
#
# ПРОФИЛЬ ДВИЖКА (замер на трёх стиллах 2026-07-28):
#   ✅ вода/туман/дождь — лучший результат, цвет держится
#   ✅ транспорт вдалеке — верная перспектива, отражения синхронны
#   ⚠️ ЦВЕТ ползёт в зелень по ходу 73-кадрового клипа (красный канал 110->69 к концу).
#      Это ФУНКЦИЯ ДЛИНЫ, не дефект модели: на 49 кадрах цвет держится идеально, но моторика
#      падает втрое. Выбор владельца 2026-07-28: берём 73 ради движения, цвет лечим грейдом.
#      Рецепт для treatment: привязать средний RGB клипа к первому кадру
#      (напр. `colorbalance`/`curves` по замеру, либо `hue=s=` + docolorbalance на хвосте).
#   ❌ человек крупнее силуэта — почти не движется, ноги слипаются
# Роутинг в scene_dispatch.engine_for() сам уводит «человеческие» шоты на veofree.

on:
  # workflow_call — чтобы пул-воркфлоу гонял эти же шаги матрицей, без копии кода
  workflow_call:
    inputs:
      job_id: {required: true, type: string}
      scene_idx: {required: true, type: string}
      prompt: {required: true, type: string}
      still_query: {required: false, type: string, default: ''}
      still_yd: {required: false, type: string, default: ''}
      seed: {required: false, type: string, default: '42'}
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      scene_idx:
        required: true
      prompt:
        required: true
        description: 'Motion prompt для i2v — с НАБЛЮДАЕМЫМ действием (параллакс, рост объектов). Слова вроде "slow/gentle drift" разрешают нулевое движение и дают фриз.'
      still_query:
        required: false
        default: ''
        description: 'Короткий (2-3 слова) запрос для стилла на Openverse. Игнорируется, если задан still_yd.'
      still_yd:
        required: false
        default: ''
        description: 'ГОТОВЫЙ стилл на ЯД (путь внутри "Content factory/", напр. cloud_io/preview/2026-08-04/conv_inside_pool/ok/wide__pexels_2224890.jpg). Задан — Openverse не опрашивается: кадр уже прошёл гейты пула.'
      seed:
        default: '42'

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "BLOCKED: LTX generation is paused by owner decision (2026-08-06)."
          exit 1
  gen:
    if: ${{ false }}
    runs-on: ubuntu-latest
    # Kaggle: ~4 мин загрузка модели + ~5 мин генерация, плюс очередь на свободный GPU
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --fix-missing rclone
          # rapidocr-onnxruntime — гейт надписей в кадре (модели внутри пакета, без apt).
          # Без него ocr_gate уходит в fail-open и стилл со знаками едет в i2v (кейс 29.07).
          pip install -q requests pillow numpy kaggle rapidocr-onnxruntime

      - name: Configure rclone ydrive
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '[ydrive]\ntype = yandex\nclient_id = %s\nclient_secret = %s\ntoken = %s\n' \
            "$YDRIVE_CLIENT_ID" "$YDRIVE_CLIENT_SECRET" "$YDRIVE_TOKEN" \
            > "$HOME/.config/rclone/rclone.conf"

      - name: Fetch still (готовый с ЯД или сток с Openverse) + upload to ЯД
        env:
          INPUT_STILL_QUERY: ${{ inputs.still_query }}
          INPUT_STILL_YD: ${{ inputs.still_yd }}
          OPENVERSE_CLIENT_ID:     ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          JOB_ID: ${{ inputs.job_id }}
          SCENE_IDX: ${{ inputs.scene_idx }}
        run: |
          if [ -n "$INPUT_STILL_YD" ]; then
            # Кадр из собранного пула: гейты (OCR + source_qc + судья) он уже прошёл там,
            # плюс его отсмотрел владелец. Второй раз сток не дёргаем.
            rclone copyto "ydrive:Content factory/$INPUT_STILL_YD" still.jpg
            test -s still.jpg || { echo "пустой стилл: $INPUT_STILL_YD"; exit 1; }
          elif [ -n "$INPUT_STILL_QUERY" ]; then
            python3 screenplay_pipeline/fetch_still.py "$INPUT_STILL_QUERY" --out still.jpg
          else
            echo "нужен still_yd или still_query"; exit 1
          fi
          rclone copyto still.jpg "ydrive:Content factory/cloud_io/render_jobs/$JOB_ID/generated/still_${SCENE_IDX}.jpg"

      - name: Generate scene (LTX i2v on Kaggle GPU)
        env:
          JOB_ID: ${{ inputs.job_id }}
          SCENE_IDX: ${{ inputs.scene_idx }}
          IMG_LOCAL: still.jpg
          PROMPT: ${{ inputs.prompt }}
          SEED: ${{ inputs.seed }}
          DEST_FOLDER: Content factory/cloud_io/render_jobs/${{ inputs.job_id }}/generated
          OUT_NAME: scene_${{ inputs.scene_idx }}.mp4
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
          # своё ядро на сцену — иначе параллельные сцены затрут версии друг друга
          LTX_KERNEL_SLUG: ${{ secrets.KAGGLE_USERNAME }}/ltx-scene-${{ inputs.job_id }}-${{ inputs.scene_idx }}
        run: python3 ltx_i2v_gen.py

      - name: Report status on failure
        if: failure()
        env:
          JOB_ID: ${{ inputs.job_id }}
          SCENE_IDX: ${{ inputs.scene_idx }}
        run: |
          rclone rcat "ydrive:Content factory/cloud_io/render_jobs/$JOB_ID/generated/scene_${SCENE_IDX}.status.txt" \
            <<< "error: sp_scene_ltx failed" || true
