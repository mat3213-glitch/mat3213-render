name: supervision-test

# Смоук-тест roboflow/supervision на наших vision-задачах (детект лиц крупным
# планом + person/object-теги пула). Ручной запуск, ноль расписания. Кладёт
# аннотированные кадры + вердикты в ЯД cloud_io/preview/2026-07-10_supervision_creative/.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # was v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # was v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libgl1 libglib2.0-0
          pip install --quiet supervision ultralytics huggingface_hub numpy
          (sudo apt-get update -qq && sudo apt-get install -y -qq rclone)

      - name: Configure rclone (ЯД / ydrive)
        env:
          YDRIVE_CLIENT_ID:     ${{ secrets.YDRIVE_CLIENT_ID }}
          YDRIVE_CLIENT_SECRET: ${{ secrets.YDRIVE_CLIENT_SECRET }}
          YDRIVE_TOKEN:         ${{ secrets.YDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [ydrive]
          type = yandex
          client_id = ${YDRIVE_CLIENT_ID}
          client_secret = ${YDRIVE_CLIENT_SECRET}
          token = ${YDRIVE_TOKEN}
          EOF

      - name: Run supervision smoke-test
        run: python supervision_test.py
